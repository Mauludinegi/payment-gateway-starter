<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Gateway Starter · Demo checkout</title>
  <style>
    :root { --bg: #0b0f17; --card: #111827; --line: #1f2937; --text: #e5edf7; --muted: #8b98ad; --accent: #22d3ee; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 80% -10%, #0e3a4a55, transparent), var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
    .eyebrow { font: 600 12px/1 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 10px 0 6px; font-size: 28px; }
    p.lead { margin: 0 0 28px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0b1220; color: var(--text); font: inherit; margin-bottom: 14px; }
    button { cursor: pointer; border: 0; border-radius: 10px; padding: 11px 16px; font: 600 14px Inter, system-ui, sans-serif; }
    .primary { background: var(--accent); color: #0b0f17; width: 100%; }
    .ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .channel { text-align: left; background: #0b1220; border: 1px solid var(--line); color: var(--text); }
    .channel small { display: block; color: var(--muted); font: 11px ui-monospace, monospace; margin-top: 2px; }
    .channel:hover { border-color: var(--accent); }
    h3 { margin: 18px 0 8px; font: 600 12px ui-monospace, monospace; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
    h3:first-child { margin-top: 0; }
    .big { font: 700 24px ui-monospace, monospace; letter-spacing: .04em; word-break: break-all; }
    .mono { font: 12px ui-monospace, monospace; color: var(--muted); word-break: break-all; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font: 700 12px ui-monospace, monospace; border: 1px solid currentColor; }
    .PENDING, .PENDING_PAYMENT { color: var(--warn); } .SUCCEEDED, .PAID { color: var(--ok); } .FAILED, .EXPIRED, .CANCELLED { color: var(--bad); }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .error { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }
    .hidden { display: none; }
    .sim { border-style: dashed; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">Payment Gateway Starter</p>
  <h1>Demo checkout</h1>
  <p class="lead">Create an order, pick a method, and watch the status change when the webhook arrives.</p>

  <section id="step-order" class="card">
    <label for="desc">Item</label>
    <input id="desc" value="Premium plan · 1 month">
    <label for="amount">Amount (IDR)</label>
    <input id="amount" type="number" value="150000" min="1000">
    <label for="name">Customer name</label>
    <input id="name" value="Budi Santoso">
    <button class="primary" id="create">Continue to payment</button>
    <div class="error" id="order-error"></div>
  </section>

  <section id="step-channel" class="card hidden">
    <div class="between"><strong id="order-ref"></strong><span id="order-amount" class="muted"></span></div>
    <div id="channels" style="margin-top:16px"></div>
    <div id="ovo-box" class="hidden" style="margin-top:12px">
      <label for="mobile">OVO mobile number</label>
      <input id="mobile" value="+6281234567890">
    </div>
    <div class="error" id="channel-error"></div>
  </section>

  <section id="step-pay" class="card hidden">
    <div class="between">
      <strong id="pay-channel"></strong>
      <span id="pay-status" class="pill"></span>
    </div>
    <div style="margin:18px 0">
      <div id="pay-label" class="muted"></div>
      <div id="pay-value" class="big"></div>
      <div id="pay-expiry" class="muted" style="margin-top:6px"></div>
    </div>
    <div class="row">
      <button class="ghost" id="copy">Copy</button>
      <button class="ghost" id="change">Change payment method</button>
    </div>
    <div id="sim" class="card sim hidden" style="margin:18px 0 0">
      <p class="muted" style="margin:0 0 10px">Simulator: play the gateway and send a signed webhook.</p>
      <div class="row">
        <button class="ghost" data-sim="pay">Simulate paid</button>
        <button class="ghost" data-sim="fail">Failed</button>
        <button class="ghost" data-sim="expire">Expired</button>
      </div>
    </div>
    <div class="error" id="pay-error"></div>
  </section>

  <section id="step-done" class="card hidden">
    <span class="pill PAID">PAID</span>
    <h2 style="margin:12px 0 4px">Payment received</h2>
    <p class="muted" id="done-text"></p>
    <button class="ghost" onclick="location.reload()">New order</button>
  </section>

  <p class="mono">GET /api/orders/{id} is polled every 3 s · webhooks: /webhooks/{xendit|midtrans}</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const idr = (n) => 'IDR ' + Number(n).toLocaleString('id-ID');
  const KIND = { VIRTUAL_ACCOUNT: 'Virtual account', QR: 'QR', EWALLET: 'E-wallet', RETAIL: 'Retail outlet' };
  const LABEL = { VIRTUAL_ACCOUNT_NUMBER: 'Virtual account number', QR_STRING: 'QRIS string (render as a QR code)', REDIRECT_URL: 'Open this link to pay', PAYMENT_CODE: 'Payment code' };
  let order = null, poll = null;

  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || (data.errors && data.errors[0]?.defaultMessage) || res.statusText);
    return data;
  }

  function show(step) {
    for (const s of ['order', 'channel', 'pay', 'done']) $('step-' + s).classList.toggle('hidden', s !== step);
  }

  $('create').onclick = async () => {
    try {
      order = await api('POST', '/api/orders', { description: $('desc').value, amount: Number($('amount').value), customerName: $('name').value });
      $('order-ref').textContent = order.reference;
      $('order-amount').textContent = idr(order.amount);
      await renderChannels();
      show('channel');
    } catch (e) { $('order-error').textContent = e.message; }
  };

  async function renderChannels() {
    const channels = await api('GET', '/api/channels');
    const groups = {};
    for (const c of channels) (groups[c.kind] ||= []).push(c);
    $('channels').innerHTML = Object.entries(groups).map(([kind, list]) =>
      `<h3>${KIND[kind]}</h3><div class="grid">` +
      list.map(c => `<button class="channel" data-channel="${c.channel}">${c.label}<small>${c.provider}</small></button>`).join('') +
      '</div>').join('');
    $('ovo-box').classList.toggle('hidden', !channels.some(c => c.channel === 'OVO'));
    $('channels').querySelectorAll('[data-channel]').forEach(b => b.onclick = () => pay(b.dataset.channel));
  }

  async function pay(channel) {
    $('channel-error').textContent = '';
    try {
      order = await api('POST', `/api/orders/${order.id}/payments`, { channel, mobileNumber: channel === 'OVO' ? $('mobile').value : null });
      render();
      show('pay');
      clearInterval(poll);
      poll = setInterval(refresh, 3000);
    } catch (e) { $('channel-error').textContent = e.message; }
  }

  async function refresh() {
    try { order = await api('GET', `/api/orders/${order.id}`); render(); } catch (e) { $('pay-error').textContent = e.message; }
  }

  function render() {
    const p = order.payment;
    if (order.status === 'PAID') {
      clearInterval(poll);
      $('done-text').textContent = `${order.reference} · ${idr(order.amount)} via ${p.channelLabel}`;
      return show('done');
    }
    $('pay-channel').textContent = p.channelLabel;
    $('pay-status').textContent = p.status;
    $('pay-status').className = 'pill ' + p.status;
    $('pay-label').textContent = LABEL[p.instructionType] || '';
    $('pay-value').textContent = p.instructionValue || '';
    $('pay-value').style.fontSize = p.instructionType === 'QR_STRING' || p.instructionType === 'REDIRECT_URL' ? '13px' : '';
    $('pay-expiry').textContent = 'Pay before ' + new Date(p.expiresAt).toLocaleString();
    $('sim').classList.toggle('hidden', p.provider !== 'SIMULATOR' || p.status !== 'PENDING');
  }

  $('copy').onclick = () => navigator.clipboard.writeText(order.payment.instructionValue || '');
  $('change').onclick = async () => { clearInterval(poll); await renderChannels(); show('channel'); };
  document.querySelectorAll('[data-sim]').forEach(b => b.onclick = async () => {
    try { await api('POST', `/api/simulator/orders/${order.id}/${b.dataset.sim}`); await refresh(); } catch (e) { $('pay-error').textContent = e.message; }
  });
</script>
</body>
</html>
