server:
  port: ${PORT:8080}

spring:
  application:
    name: payment-gateway-starter
  threads:
    virtual:
      enabled: true
  datasource:
    # Zero-setup default: in-memory H2. docker compose switches this to PostgreSQL.
    url: ${DATABASE_URL:jdbc:h2:mem:payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Per app instance. Keep it small where many instances share one database (Vercel + Supabase pooler).
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    default-schema: ${DATABASE_SCHEMA:public}
    # {vendor} adds the PostgreSQL-only callback that turns on row level security (see afterMigrate.sql).
    locations: classpath:db/migration,classpath:db/callback/{vendor}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:public}

auth:
  # Firebase project for Google sign-in; ID tokens from other projects are rejected.
  firebase-project-id: ${FIREBASE_PROJECT_ID:}
  session-ttl: ${AUTH_SESSION_TTL:P7D}
  # Name-and-email sign-in for local runs without Firebase. Turn off in production.
  dev-login-enabled: ${AUTH_DEV_LOGIN_ENABLED:true}
  # Comma-separated. Google accounts with these verified emails become ADMIN when they sign in;
  # after that, admins manage roles in the dashboard.
  admin-emails: ${ADMIN_EMAILS:}
  # Dev sign-in emails that become ADMIN (only while dev sign-in is enabled).
  dev-admin-emails: ${AUTH_DEV_ADMIN_EMAILS:admin@example.com}

# Sessions and the catalogue cache. Without these, both are kept in this instance's memory.
upstash:
  rest-url: ${UPSTASH_REDIS_REST_URL:}
  rest-token: ${UPSTASH_REDIS_REST_TOKEN:}

storage:
  # Product images. With a Supabase URL and secret key (Project settings > API keys) they go to a public Storage
  # bucket, created on the first upload; otherwise to local-dir, served at /api/media.
  supabase:
    url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:product-images}
  local-dir: ${MEDIA_DIR:data/media}

management:
  endpoints:
    web:
      exposure:
        include: health

payments:
  # Gateway for channels not listed under routing: SIMULATOR, XENDIT, or MIDTRANS.
  default-provider: ${PAYMENTS_DEFAULT_PROVIDER:SIMULATOR}
  # Per-channel gateway as one variable, e.g. PAYMENTS_ROUTES=DANA:XENDIT,BSI_VA:XENDIT,BSS_VA:XENDIT
  # (not PAYMENTS_ROUTING: as an environment variable, that name binds straight to the routing map below).
  routes: ${PAYMENTS_ROUTES:}
  # Or as a map; send e-wallets to Xendit and GoPay to Midtrans:
  # routing:
  #   OVO: XENDIT
  #   DANA: XENDIT
  #   GOPAY: MIDTRANS
  order-ttl: PT24H
  payment-ttl: PT1H
  # Where e-wallet apps send the customer back; {orderId} is replaced with the order id.
  return-url: "${PAYMENTS_RETURN_URL:http://localhost:3000/orders/{orderId}}"
  expiry-check-interval: PT1M
  # Hosts that pause the app between requests (Vercel) never fire the schedule: let requests start the job,
  # and/or call GET /internal/expiry with "Authorization: Bearer <cron-secret>" from a cron job.
  expiry-on-request: ${PAYMENTS_EXPIRY_ON_REQUEST:false}
  cron-secret: ${CRON_SECRET:}
  xendit:
    secret-key: ${XENDIT_SECRET_KEY:}
    callback-token: ${XENDIT_CALLBACK_TOKEN:}
  midtrans:
    server-key: ${MIDTRANS_SERVER_KEY:}
    base-url: ${MIDTRANS_BASE_URL:https://api.sandbox.midtrans.com}
  simulator:
    enabled: ${PAYMENTS_SIMULATOR_ENABLED:true}
    secret: ${PAYMENTS_SIMULATOR_SECRET:local-simulator-secret}

---
# Local runs (./mvnw spring-boot:run -Dspring-boot.run.profiles=local) also read .env; real environment variables win.
spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]
